name: Comprobacion de ReviewPulse

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar version del modelo
        run: python -c "import sklearn; assert sklearn.__version__ == '1.9.1'"

      - name: Comprobar sintaxis
        run: python -m compileall -q src tests experiments

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Comprobar paridad P1
        run: python -m unittest tests.test_paridad -v
